<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quick-score</title>

<!-- 홈 화면 아이콘·이름. Apps Script 주소로는 이걸 못 달아서 이 껍데기가 필요하다 -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<!-- manifest 에 start_url 을 적으면 홈 화면 아이콘이 그 주소로 열려 ?u= 가 잘린다.
     일부러 빼두었으니 다시 넣지 말 것. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="quick-score">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c4ed9">

<style>
  :root { --bg:#f6f4fc; --card:#fff; --line:#e4dff1; --ink:#211b33; --dim:#6d6483; --accent:#6c4ed9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15131f; --card:#1e1b2b; --line:#322d45; --ink:#ece9f5; --dim:#9a93b3; --accent:#8a68ec; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  iframe { display:block; width:100%; height:100%; border:0; }

  /* 주소를 아직 모를 때만 보이는 화면 */
  #setup { display:none; max-width:460px; margin:0 auto; padding:40px 20px; }
  #setup.on { display:block; }
  h1 { font-size:28px; margin:0 0 6px; text-align:center; }
  .sub { text-align:center; color:var(--dim); font-size:15px; margin:0 0 28px; line-height:1.7; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  label { display:block; font-size:14px; color:var(--dim); margin:0 0 8px; }
  input { width:100%; font-size:16px; padding:14px; border:1px solid var(--line);
          border-radius:12px; background:var(--card); color:var(--ink); font-family:inherit; }
  button { width:100%; font-size:18px; font-weight:600; padding:16px; margin-top:16px;
           border:0; border-radius:12px; background:var(--accent); color:#fff; font-family:inherit; }
  .note { font-size:14px; color:var(--dim); line-height:1.8; margin-top:20px; }
  code { background:var(--bg); padding:2px 6px; border-radius:5px; font-size:13px; word-break:break-all; }
</style>
</head>
<body>

<div id="setup">
  <h1>quick-score</h1>
  <p class="sub">그룹별 단어시험 채점</p>
  <div class="card">
    <label>선생님께 받은 주소를 붙여넣으세요</label>
    <input id="u" type="url" inputmode="url" autocomplete="off"
           placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="save()">시작하기</button>
  </div>
  <p class="note"><b>선생님께 받은 링크를 다시 열어도 됩니다.</b> 그러면 이 화면 없이 바로 들어갑니다.<br><br>
    직접 넣으실 거면 주소는 <code>script.google.com</code> 으로 시작하고 <code>/exec</code> 로 끝납니다.
    한 번만 넣으면 이 기기에 기억됩니다.</p>
</div>

<script>
/*
 * Apps Script 웹앱을 감싸는 껍데기.
 *
 * Apps Script 주소로 홈 화면에 추가하면 아이콘도 이름도 구글이 정한 것이 뜬다.
 * 페이지가 구글의 iframe 안에서 돌아서 우리가 <link rel="apple-touch-icon"> 을
 * 심을 자리가 없기 때문. 그래서 우리가 통제하는 이 페이지를 겉에 두고
 * 그 안에서 앱을 띄운다. 아이콘·이름·색은 이 파일이 결정한다.
 */
var KEY = 'qs-app-url';

function appUrl() {
  var q = new URLSearchParams(location.search).get('u');
  if (q) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  try { return localStorage.getItem(KEY); } catch (e) { return null; }
}

function save() {
  var v = document.getElementById('u').value.trim();
  if (v.indexOf('https://script.google.com/') !== 0) {
    alert('script.google.com 으로 시작하는 주소여야 합니다.');
    return;
  }
  try { localStorage.setItem(KEY, v); } catch (e) {}
  location.replace('app.html');
}

var url = appUrl();
if (url && !new URLSearchParams(location.search).get('u')) {
  /* 홈 화면 앱은 브라우저와 저장소가 분리된다. 주소창에 ?u= 를 되살려두면
     여기서 '홈 화면에 추가' 를 해도 주소가 딸려간다 */
  try { history.replaceState(null, '', 'app.html?u=' + encodeURIComponent(url)); } catch (e) {}
}
if (url) {
  var f = document.createElement('iframe');
  f.src = url;
  f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);
} else {
  document.getElementById('setup').classList.add('on');
}
</script>
</body>
</html>
